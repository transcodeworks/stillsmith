name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes an in-flight run pointless. Don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads `packageManager` from package.json (single source of truth for the
      # pnpm version). We use that field instead of `devEngines.packageManager`
      # because changeset publish shells out to npm, and npm rejects a
      # packageManager name of "pnpm" with EBADDEVENGINES.
      - uses: pnpm/action-setup@v6

      # Must come after pnpm: `cache: pnpm` shells out to pnpm to locate the store.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The e2e suite drives the *built* runtime: the Vite plugin serves
      # dist/react/runtime.js off disk, and annotations are injected from
      # dist/annotate.global.js. Tests against unbuilt source would not be
      # testing what ships.
      - run: pnpm build

      - run: pnpm check
      - run: pnpm typecheck

      - run: pnpm --filter @stillsmith/capture exec playwright install --with-deps chromium

      - run: pnpm test
